[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corkaz"
version = "0.1.0"
description = "A first-nation AI chat application."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
corkaz = "corkaz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
